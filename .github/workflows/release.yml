# Release: when a vX.Y.Z tag is pushed (by the GitFlow release/hotfix finish), create the matching GitHub Release
# through the shared github-release, its notes the tag's section of CHANGELOG.md. Nothing is attached: the marketplace
# installs the skills from the repository itself, by git.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    uses: JorgeCostaMacia/github-workflows/.github/workflows/github-release.yml@v1
